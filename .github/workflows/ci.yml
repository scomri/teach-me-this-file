name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: teach-me-this-file
          workload_identity_provider: projects/630387171976/locations/global/workloadIdentityPools/github/providers/teach-me-this-file
          service_account: github-deployer@teach-me-this-file.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      # --min-instances is left out on purpose: deploy keeps the service's current value.
      - run: >-
          gcloud run deploy teach-me-this-file --source . --region europe-west1
          --allow-unauthenticated --max-instances 1
          --memory 512Mi --cpu 1 --concurrency 80 --timeout 300 --quiet
      - run: curl -fsS https://teach-me-this-file-4pdc4dfsqa-ew.a.run.app/api/health
