<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:14pt;max-width:15cm} td{border:1px solid #000;padding:4px}</style></head><body><h1>פוטוסינתזה</h1><p>פוטוסינתזה היא התהליך שבו צמחים הופכים אור לאנרגיה כימית.</p><p>התהליך מתרחש בעלים, בתוך תאים מיוחדים, ובעיקר בשעות היום!</p><p>האם ידעת שבלי פוטוסינתזה לא היה חמצן באוויר? זה נכון: כמעט כל החמצן מגיע מצמחים ומאצות.</p></body></html>
